<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malou Dalido</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<main class="floating-area">

<div class="floating-project" data-project="projet1"><img src="images/m1.png"></div>
<div class="floating-project" data-project="projet2"><img src="images/f1.png"></div>
<div class="floating-project" data-project="projet3"><img src="images/l1.png"></div>
<div class="floating-project" data-project="projet4"><img src="images/e1.png"></div>
<div class="floating-project" data-project="projet5"><img src="images/t1.heic"></div>

</main>

<div class="name">Malou Dalido</div>
<div class="email">maloudalido@gmail.com</div>

<div class="modal" id="projectModal">
<button class="close-button" id="closeModal">×</button>
<div class="modal-content" id="modalContent"></div>
</div>

<script>

const projects=document.querySelectorAll(".floating-project");

const config=[
{speed:1.5,scale:1},
{speed:1.0,scale:.92},
{speed:.5,scale:1.05},
{speed:.75,scale:.96},
{speed:1.0,scale:1.02}
];

const state=[];

function randomAngle(side){

switch(side){

case"left":return (-45+Math.random()*90)*Math.PI/180;
case"right":return (135+Math.random()*90)*Math.PI/180;
case"top":return (45+Math.random()*90)*Math.PI/180;
case"bottom":return (-135+Math.random()*90)*Math.PI/180;

}

}

function placeFromSide(i,side,first=false){

const el=projects[i];
const w=el.offsetWidth;
const h=el.offsetHeight;

let x,y;

if(first){

x=Math.random()*(innerWidth-w);
y=Math.random()*(innerHeight-h);

}else{

switch(side){

case"left":
x=-w;
y=Math.random()*(innerHeight-h);
break;

case"right":
x=innerWidth+w;
y=Math.random()*(innerHeight-h);
break;

case"top":
x=Math.random()*(innerWidth-w);
y=-h;
break;

case"bottom":
x=Math.random()*(innerWidth-w);
y=innerHeight+h;
break;

}

}

const angle=first?Math.random()*Math.PI*2:randomAngle(side);

state[i]={

x,
y,

vx:Math.cos(angle)*config[i].speed,
vy:Math.sin(angle)*config[i].speed,

scale:config[i].scale

};

}

projects.forEach((el,i)=>placeFromSide(i,null,true));

function animate(){

projects.forEach((el,i)=>{

const s=state[i];

s.x+=s.vx;
s.y+=s.vy;

const w = el.offsetWidth;
const h = el.offsetHeight;


// DROITE → GAUCHE
if (s.x >= innerWidth) {
    s.x = -w;
    s.y = Math.random() * (innerHeight - h);

    const angle = randomAngle("left");

    s.vx = Math.cos(angle) * config[i].speed;
    s.vy = Math.sin(angle) * config[i].speed;
}

// GAUCHE → DROITE
else if (s.x + w <= 0) {
    s.x = innerWidth;
    s.y = Math.random() * (innerHeight - h);

    const angle = randomAngle("right");

    s.vx = Math.cos(angle) * config[i].speed;
    s.vy = Math.sin(angle) * config[i].speed;
}

// BAS → HAUT
if (s.y >= innerHeight) {
    s.y = -h;
    s.x = Math.random() * (innerWidth - w);

    const angle = randomAngle("top");

    s.vx = Math.cos(angle) * config[i].speed;
    s.vy = Math.sin(angle) * config[i].speed;
}

// HAUT → BAS
else if (s.y + h <= 0) {
    s.y = innerHeight;
    s.x = Math.random() * (innerWidth - w);

    const angle = randomAngle("bottom");

    s.vx = Math.cos(angle) * config[i].speed;
    s.vy = Math.sin(angle) * config[i].speed;
}

el.style.transform =
    `translate3d(${s.x}px,${s.y}px,0) scale(${s.scale})`;

});

requestAnimationFrame(animate);

}

animate();

/* ---------------- MODAL ---------------- */

const modal=document.getElementById("projectModal");
const modalContent=document.getElementById("modalContent");
const closeModal=document.getElementById("closeModal");

const projectImages={

projet1:[

"images/m5.png",
"images/r3.png",
"images/r4.png",
"images/r1.png",
"images/r2.png"
],

projet2:[
  "images/f1.pdf",
  "images/f2.pdf",
  "images/f3.pdf",
  "images/f4.pdf",
  "images/f5.pdf",
  "images/f6.pdf",
  "images/f7.pdf",
  "images/f8.pdf",

],

projet3:[
"images/l1.png",
"images/l2.pdf",
"images/l3.pdf",
"images/l4.pdf",
"images/l5.pdf",
"images/l6.pdf",
"images/l7.pdf",
"images/l8.pdf",
"images/l9.pdf",
"images/l10.pdf",
"images/l11.pdf",
"images/l12.pdf",

],

projet4:[
"images/e2.png",
"images/e3.png",
"images/e4.png",
"images/e5.png",
"images/e6.png",

],

projet5:[
"images/t3.heic",
"images/t2.heic",
]

};

projects.forEach(el=>{

el.addEventListener("click",()=>{

modalContent.innerHTML="";

projectImages[el.dataset.project].forEach(src=>{

const img=document.createElement("img");
img.src=src;
modalContent.appendChild(img);

});

modal.classList.add("active");

});

});

closeModal.onclick=()=>modal.classList.remove("active");

modal.onclick=e=>{
if(e.target===modal)modal.classList.remove("active");
};

document.onkeydown=e=>{
if(e.key==="Escape")modal.classList.remove("active");
};

</script>

</body>
</html>
